# get.storno.ro — Self-hosted installer + agent download

server {
    listen 80;
    server_name get.storno.ro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name get.storno.ro;

    ssl_certificate /etc/letsencrypt/live/get.storno.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/get.storno.ro/privkey.pem;

    charset utf-8;

    root /storage/www/storno/deploy;

    # curl https://get.storno.ro | bash
    location = / {
        default_type text/plain;
        try_files /install.sh =404;
    }

    location = /install.sh {
        default_type text/plain;
    }

    # Agent download page
    location = /agent {
        alias /storage/www/storno/deploy/download/index.html;
        default_type text/html;
    }

    # Current TLS bundle for the local agent (https://agent.storno.ro → 127.0.0.1).
    # Published by agent/scripts/renew-tls.sh; agents refresh from it (agent/src/tls.ts).
    location = /agent/tls.json {
        alias /storage/www/storno/deploy/download/tls.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Self-hoster data assets (company registry SQLite + checksum).
    # Refresh procedure documented in deploy/data/README.md.
    location ~ ^/data/[a-z0-9._-]+\.(sqlite|sha256)$ {
        root /storage/www/storno/deploy;
        add_header Cache-Control "public, max-age=86400";
        sendfile on;
        tcp_nopush on;
    }

    location / {
        return 404;
    }
}
